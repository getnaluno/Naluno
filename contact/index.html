<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Contact Naluno</title>
<meta name="description" content="Write to Naluno: a question, a problem, or a request to delete an account. A person reads every message." />
<meta name="theme-color" content="#07080D" />
<link rel="canonical" href="https://getnaluno.com/contact/" />
<link rel="icon" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css?v=20261014d">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/" aria-label="Naluno home">
      <svg viewBox="0 0 68 68" fill="none" aria-hidden="true">
        <circle cx="34" cy="38" r="11" stroke="#7CFFB2" stroke-width="3"/>
        <path d="M34 27V21" stroke="#7CFFB2" stroke-width="3" stroke-linecap="round"/>
        <path d="M22 20c6-8 18-8 24 0" stroke="#00E5FF" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>
        <path d="M16 14c9-12 27-12 36 0" stroke="#7C4DFF" stroke-width="2" stroke-linecap="round" opacity=".75"/>
      </svg>
      <b>NALUNO</b>
    </a>
    <nav class="nav" aria-label="Main">
      <a class="hide-sm" href="/">Home</a>
      <a class="hide-sm" href="/invest/">Investors</a>
      <a class="btn primary small" href="/app/">Open Naluno</a>
    </nav>
  </header>
</div>
<main>
<section class="hero">
  <div class="wrap">
    <p class="kicker">Contact</p>
    <h1>Write to Naluno.</h1>
    <p class="lede">A person reads every message. Use this for a question, a problem, or to ask that an account be deleted. If you want to invest or partner, the <a href="/invest/#talk">investor page</a> has its own form.</p>
    <form id="nalunoContact" class="form" novalidate>
    <label class="hp" aria-hidden="true">Company <input type="text" name="company" tabindex="-1" autocomplete="off"></label>
    <label for="cName">Name</label>
    <input id="cName" name="name" maxlength="80" autocomplete="name" />
    <label for="cHandle">Handle, if you have one</label>
    <input id="cHandle" name="handle" maxlength="40" autocomplete="username" />
    <label for="cEmail">Reply-to (so we can write back)</label>
    <input id="cEmail" name="email" type="email" maxlength="120" autocomplete="email" inputmode="email" />
    <label for="cText">Message</label>
    <textarea id="cText" name="text" required maxlength="6000" placeholder="What should we know?"></textarea>
    <label class="row-check"><input id="cDelete" type="checkbox" name="delete" /> This is a request to delete a Naluno account.</label>
    <button class="btn primary" type="submit" id="cSend">Send</button>
    <div class="status" id="cStatus" role="status"></div>
  </form>
  </div>
</section>
</main>
<footer>
  <div class="wrap">
    <div>Naluno · getnaluno.com</div>
    <div><a href="/">Home</a><a href="/app/">Open Naluno</a><a href="/invest/">Investors</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a></div>
  </div>
</footer>
<script>
(function(){
  var form = document.getElementById('nalunoContact');
  if(!form) return;
  var MAIL = 'https://naluno-economy.naluno.workers.dev/v1/mail';
  var status = document.getElementById('cStatus');
  var btn = document.getElementById('cSend');
  function setStatus(kind, text){
    status.className = 'status' + (kind ? ' ' + kind : '');
    status.textContent = text || '';
  }
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var text = (document.getElementById('cText').value || '').trim();
    if(text.length < 2){ setStatus('err', 'Write a message first.'); return; }
    var wantDelete = !!(document.getElementById('cDelete') && document.getElementById('cDelete').checked);
    var email = (document.getElementById('cEmail').value || '').trim();
    var handle = (document.getElementById('cHandle').value || '').trim();
    if(wantDelete && !email && !handle){
      setStatus('err', 'Leave a handle or a reply-to so we know which account.');
      return;
    }
    btn.disabled = true;
    setStatus('', 'Sending…');
    fetch(MAIL, {
      method: 'POST',
      cache: 'no-store',
      credentials: 'omit',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        source: 'web',
        kind: wantDelete ? 'delete-account' : 'contact',
        name: (document.getElementById('cName').value || '').trim(),
        handle: handle,
        email: email,
        text: text,
        company: (form.elements.company && form.elements.company.value) || ''
      })
    }).then(function(res){ return res.json().then(function(j){ return { res: res, j: j }; }); })
      .then(function(pack){
        if(pack.j && pack.j.ok){
          form.reset();
          setStatus('ok', wantDelete
            ? 'Request received. A person will close the account by hand — this is not instant.'
            : 'Received. A person will read this.');
          try{ if(window.nalunoPulse) window.nalunoPulse('contact'); }catch(_){}
          return;
        }
        setStatus('err', (pack.j && pack.j.error) || 'Could not send just now. Try again in a minute.');
      })
      .catch(function(){
        setStatus('err', 'Could not send just now. Check the connection and try again.');
      })
      .then(function(){ btn.disabled = false; });
  });
})();
</script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="/firebase-config.js?v=20260914c"></script>
<script src="/js/site-pulse.js?v=20261006b"></script>
</body>
</html>
