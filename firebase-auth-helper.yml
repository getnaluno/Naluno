# Keeps Google's sign-in hand-back files on getnaluno.com (/__/auth/).
# Firebase: "Option 4: Self-host the sign-in helper code"
# https://firebase.google.com/docs/auth/web/redirect-best-practices
#
# Run it once by hand: Actions -> Firebase sign-in helper -> Run workflow.
# After that it refreshes the files every Monday, as Firebase recommends,
# and commits only when Google changed them.
name: Firebase sign-in helper

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write
  pages: write

concurrency:
  group: firebase-auth-helper
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Google's sign-in files for naluno-28a00
        run: |
          set -euo pipefail
          base="https://naluno-28a00.firebaseapp.com"
          mkdir -p __/auth __/firebase
          # GitHub Pages serves /__/auth/handler from handler.html, as an
          # HTML page; a file with no extension would be downloaded instead.
          # Required: the sign-in hand-back pages and their scripts.
          curl -fsSL --retry 3 "$base/__/auth/handler"    -o __/auth/handler.html
          curl -fsSL --retry 3 "$base/__/auth/handler.js" -o __/auth/handler.js
          curl -fsSL --retry 3 "$base/__/auth/iframe"     -o __/auth/iframe.html
          curl -fsSL --retry 3 "$base/__/auth/iframe.js"  -o __/auth/iframe.js
          # Optional. /__/firebase/init.json only exists for projects on
          # Firebase Hosting; naluno-28a00 answers 404 there (run #3 failed on
          # it, curl exit 22). Sign-in does not need it: the app passes its
          # own settings to the handler.
          optional() {
            if curl -fsSL --retry 2 "$base/$1" -o "$2.tmp"; then mv "$2.tmp" "$2"; echo "got $1";
            else rm -f "$2.tmp"; echo "skipped $1 (not served for this project)"; fi
          }
          optional __/auth/experiments.js __/auth/experiments.js
          optional __/auth/links          __/auth/links.html
          optional __/auth/links.js       __/auth/links.js
          optional __/firebase/init.json  __/firebase/init.json
          rmdir __/firebase 2>/dev/null || true
          # Without this file GitHub Pages runs Jekyll, which skips every
          # folder whose name starts with "_" (so /__/ would not exist).
          touch .nojekyll

      - name: Check the files are the real ones
        run: |
          set -euo pipefail
          for f in __/auth/handler.html __/auth/iframe.html; do
            [ "$(wc -c < "$f")" -gt 100 ] || { echo "$f is too small"; exit 1; }
            grep -qi '<html\|<!doctype\|<script\|<meta' "$f" || { echo "$f is not an HTML page"; exit 1; }
          done
          for f in __/auth/handler.js __/auth/iframe.js; do
            [ "$(wc -c < "$f")" -gt 200 ] || { echo "$f is too small"; exit 1; }
          done
          if [ -f __/firebase/init.json ]; then grep -q '"projectId": *"naluno-28a00"' __/firebase/init.json; fi
          ls -l __/auth .nojekyll

      - name: Commit if anything changed
        id: commit
        run: |
          set -euo pipefail
          git add .nojekyll __/
          if git diff --cached --quiet; then
            echo "No change from Google."
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Firebase sign-in helper files (self-hosted on getnaluno.com)"
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"

      - name: Ask GitHub Pages to publish
        if: steps.commit.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will publish from the push."

      - name: Check getnaluno.com serves them
        run: |
          set -uo pipefail
          for i in $(seq 1 20); do
            ct=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "https://getnaluno.com/__/auth/handler?probe=$i" || true)
            echo "try $i: $ct"
            case "$ct" in 200\ text/html*) echo "OK: https://getnaluno.com/__/auth/handler is live."; exit 0;; esac
            sleep 30
          done
          echo "::warning::getnaluno.com/__/auth/handler is not live yet. The app keeps using the old sign-in way until it is, so nothing breaks; re-run this workflow later."
